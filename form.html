<!DOCTYPE html>
<html>

<head>
    <title> Forms </title>
</head>

<body>
    <h1> HTML Forms</h1>
    <form>

        Name <br /><input type="text" placeholder="Name" /> <br /><br />
        Email <br /> <input type="email" placeholder="email" /> <br /> <br />
        Mobile <br /> <input type="number" placeholder="Mobile no" /> <br /> <br />
        Password <br /> <input type="password" placeholder="Password" /> <br /> <br />
        Confirm Password <br /> <input type="password" placeholder="Confirm Password" /> <br /> <br />
        Country <br />
        <select>
            <option>India</option>
            <option>USA</option>
            <option>Canada</option>
            <option>Newzeland</option>
            <option>Australia</option>
        </select>
        <br/> <br />
        Terms & Conditions <input type="checkbox"  value="Yes"/><br/>
        <input type="checkbox"  value="Terminator"/>Terminator <br/>
        <input type="checkbox"  value="Avatar"/>Avatar <br/>

        <br/> 

        Gender <br/>
        <input type="radio" value="Male" name="gender"/> Male <br/>
         <input type="radio" value="Female" name="gender"/>  Female <br/>
         <br/>

         Address <br/>
         <textarea rows="10" cols="80">  </textarea>

    </form>
</body>

</html>
