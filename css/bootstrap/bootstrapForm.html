<!DOCTYPE html>

<head>
    <title>Bootstrap Forms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="bootstrap.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container">

        <div class="row align-items-center">
            <div class="col-7 pt-5">
                <h1>Dream software job in 6 months</h1>
                <p>Learn in-demand technology industry-expertsand become job ready</p>
            </div>
            <div class="col-5 pt-5">

                <div class="bg-white p-3">
                    <h2 class="text-center"> Talk to us</h2>
                    <div class="mb-3">
                        <label for="nameFormControlInput1" class="form-label">Name</label>
                        <input type="Name" class="form-control" id="nameFormControlInput1" placeholder="name">
                    </div>
                    <div class="mb-3">
                        <label for="exampleFormControlInput1" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="exampleFormControlInput1"
                            placeholder="name@example.com">
                    </div>
                    <div class="mb-3">
                        <label for="inputPassword5" class="form-label">Password</label>
                        <input type="password" id="inputPassword5" class="form-control"
                            aria-describedby="passwordHelpBlock">
                        <div id="passwordHelpBlock" class="form-text mb-2">
                            Your password must be 8-20 characters long, contain letters and numbers, and must not
                            contain spaces, special characters, or emoji.
                        </div>

                        <div class="mb-3">
                            <label for="exampleFormControlTextarea1" class="form-label">Example textarea</label>
                            <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                        </div>


                        <div class="form-check mb-3 p-3">
                            <input class="form-check-input me-1" type="checkbox" value="Yes" id="firstCheckbox">
                            <label class="form-check-label" for="firstCheckbox">Terms and Conditions</label>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <input class="btn btn-warning btn-lg" type="submit" value="Submit">
                        </div>

                        <div class="mt-3">
                            <div class="alert alert-success">
                                Data received we will get back o you soon.
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

</body>

</html>
